<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,800;1,800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
  <div class="card">
    <img src="./assets/images/illustration-article.svg" alt="Article Illustration figure">
    <p class="tag">Learning</p>
    <p class="date">Published 4 Nov 2026</p>
    <h1>HTML & CSS Foundations</h1>
    <p class="card-description">
      These languaages are the backbone of every website, defining structure, 
      content, and presentation.
    </p>
    <div class="avatar">
      <img src="./assets/images/image-avatar.webp" alt="Author Avatar Image">  
      <h2>Greg Hooger</h2>
    </div>
  </div>

</body>
</html>
